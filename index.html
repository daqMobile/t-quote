<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick Quote</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quick Quote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a store quoting console. Sticky top bar with the running quote price; a Build rail and a Review rail
   frame the work area on wide screens (bottom Build/Review bar on phones). Work area = tabs, discount band,
   plan tier strip, device-group cards, Add Devices tray. Edit Options and Review open as side drawers. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#121A22; --muted:#56646F; --line:#D3DAE1;
  --accent:#2742D1; --accent-ink:#FFFFFF; --accent-soft:#E3E8FC;
  --band:#2742D1; --band-ink:#FFFFFF; --build:#B4412E; --build-ink:#FFFFFF; --badge:#E8A13A; --badge-ink:#121A22;
  --paper:#FCFCF7; --paper-line:#BFC5BC;
  --good:#0E7A54; --warn:#9A4A0A; --bad:#BF2A1F;
  --scrim:rgba(13,18,23,.45);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#151C23; --sunk:#1B232B; --ink:#E6EBF0; --muted:#94A2AE; --line:#2B3640;
    --accent:#8FA0FF; --accent-ink:#0D1217; --accent-soft:#1E2747;
    --band:#3A52D9; --band-ink:#FFFFFF; --build:#C4553F; --build-ink:#FFFFFF; --badge:#F0B357; --badge-ink:#121A22;
    --paper:#1A2027; --paper-line:#3A444D;
    --good:#4FC48D; --warn:#F0A257; --bad:#FF7B70;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --sunk:#1B232B; --ink:#E6EBF0; --muted:#94A2AE; --line:#2B3640;
  --accent:#8FA0FF; --accent-ink:#0D1217; --accent-soft:#1E2747;
  --band:#3A52D9; --band-ink:#FFFFFF; --build:#C4553F; --build-ink:#FFFFFF; --badge:#F0B357; --badge-ink:#121A22;
  --paper:#1A2027; --paper-line:#3A444D;
  --good:#4FC48D; --warn:#F0A257; --bad:#FF7B70;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topin{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand pill acts";align-items:center;gap:8px 14px}
.brand{grid-area:brand;display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 2px;font-weight:600;font-size:16px}
.mark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em}
.pill{grid-area:pill;justify-self:center;display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;min-width:0}
.pill .cq{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13.5px;border:0;background:none;padding:4px 0;white-space:nowrap}
.pill .sep{width:1px;height:20px;background:var(--line)}
.pill .amt{display:flex;align-items:baseline;gap:4px;border:0;background:none;padding:2px 0;color:var(--accent);white-space:nowrap}
.pill .amt b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .amt small{font-size:12.5px}
.pill .go{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.acts{grid-area:acts;display:flex;align-items:center;gap:8px}
.ja{border:0;background:none;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;padding:6px 4px}
.startnew{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 18px;white-space:nowrap}
.startnew.confirm{background:var(--bad);color:#fff}
.exchip{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
@media (max-width:899px){
  .topin{grid-template-columns:1fr auto;grid-template-areas:"brand acts" "pill pill"}
  .pill{justify-self:stretch;justify-content:space-between}
}
@media (max-width:599px){
  .ja{display:none}
  .startnew{padding:8px 14px}
}

/* ---------- Shell with rails ---------- */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
@media (min-width:900px){
  .shell{grid-template-columns:34px minmax(0,1fr) 34px;min-height:calc(100vh - 60px)}
  .rail{display:block;border:0;padding:0;color:#fff;position:relative}
  .rail span{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;align-items:center;justify-content:center;gap:10px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:13px;letter-spacing:.12em;padding:18px 0;width:100%}
  .rail.build{background:var(--build);color:var(--build-ink)}
  .rail.review{background:var(--band);color:var(--band-ink)}
  .rail.review span{transform:none}
  .rail b{font-size:18px;line-height:1}
}
.stage{min-width:0;padding-block:14px 150px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.stage{padding:16px 20px 60px}}

/* ---------- Tabs & discount band ---------- */
.tabs{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--surface);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.band{background:var(--band);color:var(--band-ink);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:0 6px 0 0}
.bandbtn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--band-ink);border-radius:4px;background:transparent;color:var(--band-ink);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px}
.bandbtn .ico{width:14px;height:14px;transition:transform .15s}
.bandbtn[aria-expanded="false"] .ico{transform:rotate(180deg)}
.band select{border:0;border-radius:4px;background:var(--surface);color:var(--ink);padding:7px 10px;font-size:14px;max-width:100%;min-width:0}
.bchip{font-size:12.5px;padding:4px 9px;border-radius:4px;background:rgba(255,255,255,.18);color:var(--band-ink);font-weight:500}
.bchip.on{background:var(--badge);color:var(--badge-ink);font-weight:700}
.dpanel{background:var(--surface);border:1px solid var(--line);border-top:0;padding:14px;display:grid;gap:14px}
@media (min-width:720px){.dpanel{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.flabel{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.fhint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.selwrap{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.selwrap select{flex:1;min-width:0;border:0;background:transparent;padding:9px 10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--accent);border-radius:6px;overflow:hidden;max-width:100%}
.seg button{border:0;background:var(--surface);color:var(--accent);font-weight:600;font-size:14px;padding:9px 14px;flex:1 1 auto}
.seg button + button{border-left:1.5px solid var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.45}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);display:grid;place-items:center;padding:0}
.stepper button:disabled{border-color:var(--line);color:var(--muted);opacity:.6}
.stepper output{min-width:40px;height:30px;line-height:28px;text-align:center;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-variant-numeric:tabular-nums}

/* ---------- Tier strip ---------- */
.tierbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 12px}
.tiers{display:flex;align-items:stretch;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow-x:auto;max-width:100%;font-size:13px}
.tiers .lead{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.tiers .lead small{font-weight:500;font-size:11px}
.tiers button{border:0;background:transparent;padding:8px 10px;white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.tiers button[aria-pressed="true"]{font-weight:700;color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tiers button:disabled{color:var(--muted)}
.tbtns{display:flex;align-items:center;gap:10px}
.obtn{border:1.5px solid var(--accent);border-radius:999px;background:var(--surface);color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px}
.vtog{display:inline-flex;border:1.5px solid var(--accent);border-radius:4px;overflow:hidden}
.vtog button{border:0;background:var(--surface);color:var(--accent);padding:6px 9px;display:grid;place-items:center}
.vtog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- Device cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05);min-width:0}
.chead{background:var(--sunk);padding:12px 14px;border-bottom:1px solid var(--line)}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:15px}
.ctitle .x{border:0;background:none;color:var(--accent);padding:4px;display:grid;place-items:center}
.cdev{display:flex;align-items:center;gap:14px;margin-top:10px}
.devico{position:relative;width:54px;height:58px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.devico svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--badge);color:var(--badge-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.cbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.editbtn{align-self:flex-start;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:10px 20px}
.cost{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.cost .h{font-weight:600;font-size:14.5px;margin-bottom:2px}
.cost .r{display:flex;justify-content:space-between;gap:10px}
.cost .r span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.cost small{color:var(--muted);font-size:12.5px}
.cost .cr span:last-child{color:var(--good)}
.cost .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:700}
.cwarn{font-size:12.5px;color:var(--warn);font-weight:600}
.cards.list{grid-template-columns:minmax(0,1fr);gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.lrow .devico{width:44px;height:46px}
.lrow .devico svg{width:28px;height:28px}
.lrow .lt{min-width:0}
.lrow .lt b{display:block;font-size:14.5px}
.lrow .lt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lm{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lrow .lm button{display:block;margin-top:4px;border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:0}
.empty{border:2px dashed var(--line);border-radius:6px;padding:28px 18px;text-align:center;color:var(--muted)}

/* ---------- Add devices tray ---------- */
.tray{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;position:relative}
.handle{position:absolute;left:50%;top:-1px;transform:translate(-50%,-100%);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--surface);color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 16px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.handle .ico{width:16px;height:12px;transition:transform .15s}
.handle[aria-expanded="false"] .ico{transform:rotate(180deg)}
.trayin{padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.traycount{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,118px));justify-content:center;gap:12px;width:100%}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--accent);font-size:13.5px}
.tile svg.dev{width:46px;height:52px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile .plus{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tile .plus .ico{width:16px;height:16px;stroke-width:2.6}
.tile .badge{top:6px;right:6px;background:var(--accent-soft);color:var(--accent)}
.tile:disabled{opacity:.45}

/* ---------- Home internet ---------- */
.hint-plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.hplan{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.hplan[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.hplan .n{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.hplan .p{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hplan .p small{font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--muted)}
.hplan .d{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-top:0;padding:16px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-weight:600}
.switch .knob{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"] .knob{background:var(--accent)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px)}

/* ---------- Phone bottom bar ---------- */
.pnav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:1fr 1.6fr;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.pnav button{border:0;padding:12px 10px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.pnav .b{background:var(--build);color:var(--build-ink)}
.pnav .r{background:var(--band);color:var(--band-ink)}
.pnav .r b{font-family:var(--display);font-size:20px;letter-spacing:0;font-variant-numeric:tabular-nums}
@media (min-width:900px){.pnav{display:none}}

/* ---------- Drawers ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(460px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:-12px 0 32px -16px rgba(0,0,0,.4);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.wide{width:min(760px,100%)}
.drawer.left{right:auto;left:0;box-shadow:12px 0 32px -16px rgba(0,0,0,.4)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.dhead p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.dbody{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.dfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:14px}
.linkbtn.danger{color:var(--bad)}
.pbtn{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:11px 24px}

/* Numbered option boxes */
.box{background:var(--surface);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.boxh{background:var(--band);color:var(--band-ink);display:flex;align-items:center;gap:12px;padding:11px 16px;font-size:17px;font-weight:500}
.num{width:26px;height:26px;border-radius:50%;background:var(--band-ink);color:var(--band);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}

function compareBody(q){

    return {id:id, pc:pc, pk: c.fam === "tmix" ? picksFor(id, n) : null};
  });
  var max = Math.max.apply(null, rows.map(function(r){ return r.pc ? r.pc.total : 0; }));

function byDate(a, b){ return String(b.savedAt || "").localeCompare(String(a.savedAt || "")); }

}

  if (Date.now() - (startLive._t || 0) > 10 * 60 * 1000) startLive();
  checkUpdate();
});

/* ================= Updates ================= */
/* GitHub Pages lets devices reuse a saved copy of the page for up to 10 minutes.
   On open, compare this page's code with the live one and switch to the new version.
   The quote on screen is saved first, so nothing is lost. */
function pageCode(doc){
  var els = doc.querySelectorAll("script:not([src]), style"), out = "";
  for (var i = 0; i < els.length; i++) out += els[i].textContent;
  return out;
}
var MY_CODE = pageCode(document), _upd = 0;
function checkUpdate(){
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  if (Date.now() - _upd < 60 * 1000) return;
  _upd = Date.now();
  fetch(location.pathname + "?u=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(t){
    if (!t) return;
    var code = pageCode(new DOMParser().parseFromString(t, "text/html"));
    if (!code || code === MY_CODE) return;
    if (ui.sheet || ui.edit) { _upd = 0; return; }   // a drawer is open: update next time instead
    var last = 0; try { last = +sessionStorage.getItem(KEY + ".upd") || 0; } catch (e) {}
    if (Date.now() - last < 2 * 60 * 1000) return;    // already tried just now; never loop
    try { sessionStorage.setItem(KEY + ".upd", String(Date.now())); } catch (e) {}
    save();
    fetch(location.pathname, {cache:"reload"}).then(null, function(){}).then(function(){ location.reload(); });
  }).catch(function(){});
}

/* Puts the designed email on the clipboard as formatted text, with a plain-text copy for apps that can't paste formatting. */
function copyRich(html, text){
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      return navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob(['<meta charset="utf-8">' + html], {type:"text/html"}),
        "text/plain": new Blob([text], {type:"text/plain"})
      })]);
    }
  } catch (e) {}
  return Promise.reject(new Error("no_rich_clipboard"));
}

  out.push(dateStr() + " · " + (state.autopay ? "AutoPay" : "No AutoPay") + (state.loaded ? " · Quote ID " + state.loaded.id : ""));
  out.push(""); out.push("MONTHLY");

  out.push(pad(c.fam === "exp" ? "Added monthly" : "Total monthly", fmt(q.monthly)) + "  + taxes & fees");

      try { navigator.clipboard.writeText(ap.appHref).then(function(){ toast("Copied. Now tap your Outlook Quote shortcut."); }, afail); } catch (err) { afail(); }
      return;
    }
    case "openmail": case "openweb": case "openapp": {
      var mp = mailParts(compute(state));
      if (!mp.ok) {
        e.preventDefault();
        ui.mail.err = mp.to ? BAD_EMAIL : "Add the customer's email address first.";
        updateMail();
        var tf = document.getElementById("mTo"); if (tf) tf.focus();
        return;
      }
      b.setAttribute("href", act === "openweb" ? mp.webHref : (act === "openapp" ? mp.appHref : mp.href));
      if (act === "openapp" && ui.mail.style !== "plain") {
        toast("Email copied. In Outlook, touch and hold the message area and tap Paste.");
        copyRich(mp.html, mp.body).then(null, function(){ toast("Couldn't copy the designed email. Tap Copy designed email, then try again."); });
        return;
      }
      toast(act === "openweb" ? "Opening Outlook.com. Check the email, then tap Send."
          : (act === "openapp" ? "Opening the Outlook app. Check the From line, then tap Send." : "Trying your mail app. If nothing opens, use Outlook.com."));
      return;
    }
    case "copyrich": {
      var rp = mailParts(compute(state));
      copyRich(rp.html, rp.body).then(function(){ toast("Designed email copied. Paste it into the message in Outlook."); },
        function(){ toast("This browser can't copy the designed email. Use Plain text instead."); });
      return;
    }
    case "copymail": {
      var body = mailParts(compute(state)).body, mf = document.getElementById("mailFallback");
      var mfail = function(){ if (mf) { mf.value = body; mf.hidden = false; mf.focus(); mf.select(); } toast("Select the text and copy it."); };
      try { navigator.clipboard.writeText(body).then(function(){ toast("Message copied. Paste it into a new email."); }, mfail); } catch (err) { mfail(); }
      return;
    }
    case "sheet": ui.sheet = v; if (v === "email") ui.mail.err = ""; if (v === "save") live.saved = null; if (v === "open") { live.openErr = ""; loadRecent(); } break;
    case "dosave": { var ne = document.getElementById("qNote"); doSave(ne ? ne.value : ""); return; }
    case "copyid": {
      var sid = live.saved && live.saved.id; if (!sid) return;
      try { navigator.clipboard.writeText(sid).then(function(){ toast("Quote ID " + sid + " copied."); }, function(){ toast("Quote ID: " + sid); }); } catch (err) { toast("Quote ID: " + sid); }
      return;
    }
    case "openid": doOpen(v); return;
    case "reprice":
      state.groups.forEach(function(x){ if (x.dev.offer !== "custom") x.dev.offer = "best"; });
      state.loaded = null; toast("Repriced with today's offers."); break;
    case "unload": state = blankState(); ui.sheet = null; resetMail(); toast("Closed the saved quote."); break;
    case "close": ui.sheet = null; ui.edit = null; break;
    case "build": ui.sheet = null; ui.edit = null; window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); break;
    case "startnew":
      if (!ui.confirm) { ui.confirm = true; clearTimeout(ui._ct); ui._ct = setTimeout(function(){ ui.confirm = false; renderAll(); }, 3500); break; }
      ui.confirm = false; state = blankState(); ui.sheet = null; resetMail(); toast("Started a new quote."); break;
    case "example": state = exampleState(); ui.sheet = null; resetMail(); toast("Example quote loaded."); break;
    case "tab": state.tab = v; break;
    case "discounts": state.discountsOpen = !state.discountsOpen; break;
    case "cust":
      state.cust = v;
      state.groups.forEach(function(x){ if (v === "new" && x.lineType === "upgrade") x.lineType = TYPES[x.type].voice ? "port" : "new"; if (x.dev.offer !== "best" && x.dev.offer !== "custom" && x.dev.offer !== "full") x.dev.offer = "best"; });
      if (v === "existing") state.planDiscount = "none";
      break;
    case "exlines": state.existingLines = Math.max(1, Math.min(11, state.existingLines + (+v))); break;
    case "plan": if (state.cust === "new") state.planNew = v; else state.planExp = v; afterPlanChange(); break;
    case "view": state.view = v; break;
    case "tray": ui.trayOpen = !ui.trayOpen; break;
    case "traytab": ui.trayTab = v; break;
    case "add": {
      var ng = newGroup(v, state.cust);
      state.groups.push(ng);
      toast(TYPES[v].label + " added. Tap Edit Options to set it up.");
      break;
    }
    case "remove": state.groups = state.groups.filter(function(x){ return x.id !== v; }); if (ui.edit === v) { ui.sheet = null; ui.edit = null; } break;
    case "qty": if (g) g.qty = Math.max(1, Math.min(20, g.qty + (+v))); break;
    case "edit": ui.sheet = "edit"; ui.edit = v; ui.tagFilter = null; { var eg = grp(v), em = eg && model(eg.dev.model); if (em) ui.mfr = em.mfr; } break;
    case "kind": if (g) { g.dev.kind = v; if (v !== "new" && g.dev.offer !== "full") g.dev.offer = v === "custom" ? g.dev.offer : "best"; } break;
    case "tagf": ui.tagFilter = ui.tagFilter === v ? null : v; break;
    case "mfr": ui.mfr = v; break;
    case "model": if (g) { g.dev.model = v || null; if (!v) g.dev.offer = "best"; } break;
    case "pay": if (g) g.pay.method = v; break;
    case "perk": { var ix = state.perks.indexOf(v); if (ix > -1) state.perks.splice(ix, 1); else state.perks.push(v); break; }
    case "hinton": state.hint.on = !state.hint.on; break;
    case "hplan": state.hint.plan = v; state.hint.on = true; break;
    default: return;
  }
  if (["sheet","close","build","tab","discounts","view","tray","traytab","tagf","mfr","edit","startnew","mstyle","ghclear"].indexOf(act) < 0 && act !== "example") state.example = false;
  var focusId = document.activeElement && document.activeElement.id;
  renderAll();
  if (act === "sheet" || act === "edit") { var t = $("#dTitle"); if (t) t.focus({preventScroll:true}); }
  else if (focusId) { var fe = document.getElementById(focusId); if (fe) fe.focus({preventScroll:true}); }
});
document.addEventListener("input", function(e){
  var el = e.target;
  if (el.dataset && el.dataset.m) {
    ui.mail[el.dataset.m] = el.value;
    if (el.dataset.m === "sig") { try { localStorage.setItem(KEY + ".sig", el.value); } catch (err) {} }
    if (el.dataset.m === "to") ui.mail.err = "";
    updateMail();
    return;
  }
  if (!el.dataset || !el.dataset.k) return;
  if (el.tagName === "SELECT" || el.type === "checkbox" || el.type === "radio") return;
  setPath(el.dataset.k, el.dataset.t === "num" ? (parseFloat(el.value) || 0) : el.value);
  state.example = false;
  renderLive();
});
document.addEventListener("change", function(e){
  var el = e.target;
  if (el.dataset && el.dataset.m === "to") { var tv = el.value.trim(); ui.mail.err = tv && !EMAIL_RE.test(tv) ? BAD_EMAIL : ""; updateMail(); return; }
  if (!el.dataset || !el.dataset.k) return;
  if (el.tagName !== "SELECT" && el.type !== "checkbox" && el.type !== "radio") return;
  var t = el.dataset.t, val;
  if (t === "bool") val = el.checked; else if (t === "bool01") val = el.value === "1"; else if (t === "num") val = parseFloat(el.value) || 0; else val = el.value;
  setPath(el.dataset.k, val);
  if (el.dataset.k === "__plan") afterPlanChange();
  state.example = false;
  var id = el.id;
  renderAll();
  var ne = id && document.getElementById(id); if (ne) ne.focus({preventScroll:true});
});
document.addEventListener("submit", function(e){
  if (e.target && e.target.id === "openForm") { e.preventDefault(); var f = document.getElementById("qId"); doOpen(f ? f.value : ""); }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && ui.sheet) { ui.sheet = null; ui.edit = null; renderAll(); }
});

renderAll();
startLive();
checkUpdate();
})();
