<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quick Quote</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quick Quote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<script>try{var qqt=localStorage.getItem("tmix-quick-quote.v2.theme");if(qqt==="light"||qqt==="dark")document.documentElement.setAttribute("data-theme",qqt)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
/* Layout: a store quoting console. Sticky top bar with the running quote price; a Review rail
   on the right of the work area on wide screens (a bottom Review bar on narrow screens). Work area = tabs, discount band,
   plan tier strip, device-group cards, Add Devices tray. Edit Options and Review open as side drawers. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F3F5F8; --ink:#121A22; --muted:#56646F; --line:#D3DAE1;
  --accent:#C2006A; --accent-ink:#FFFFFF; --accent-soft:#FBE7F1;
  --band:#B50064; --band-ink:#FFFFFF; --review:#505862; --review-ink:#FFFFFF; --badge:#E8A13A; --badge-ink:#121A22;
  --good:#0E7A54; --warn:#9A4A0A; --bad:#BF2A1F;
  --scrim:rgba(13,18,23,.45);
  /* TeleNeo is Telekom's own licensed typeface and can't be served from this site; Inter is the closest free match. */
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --surface:#151C23; --sunk:#1B232B; --ink:#E6EBF0; --muted:#94A2AE; --line:#2B3640;
    --accent:#F57AB9; --accent-ink:#0D1217; --accent-soft:#3A1830;
    --band:#EC70B0; --band-ink:#0D1217; --review:#353C45; --review-ink:#FFFFFF; --badge:#F0B357; --badge-ink:#121A22;
    --good:#4FC48D; --warn:#F0A257; --bad:#FF7B70;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-mode="biz"]{--accent:#8A0050; --accent-soft:#F3E2EB; --band:#77003F; --band-ink:#FFFFFF}
.bizlbl{font-weight:500;opacity:.85}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#151C23; --sunk:#1B232B; --ink:#E6EBF0; --muted:#94A2AE; --line:#2B3640;
  --accent:#F57AB9; --accent-ink:#0D1217; --accent-soft:#3A1830;
  --band:#EC70B0; --band-ink:#0D1217; --review:#353C45; --review-ink:#FFFFFF; --badge:#F0B357; --badge-ink:#121A22;
  --good:#4FC48D; --warn:#F0A257; --bad:#FF7B70;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Top bar ---------- */
/* Everything in the top bar is drawn 15% larger, as a whole. */
.topin{zoom:1.15}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.topin{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"brand pill acts";align-items:center;gap:8px 14px}
.brand{grid-area:brand;display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 2px;font-weight:600;font-size:16px}
.mark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em}
.pill{grid-area:pill;justify-self:center;display:flex;align-items:center;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;min-width:0}
.pill .cq{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13.5px;border:0;background:none;padding:4px 0;white-space:nowrap}
.pill .sep{width:1px;height:20px;background:var(--line)}
.pill .amt{display:flex;align-items:baseline;gap:4px;border:0;background:none;padding:2px 0;color:var(--accent);white-space:nowrap}
.pill .amt b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .amt small{font-size:12.5px}
.pill .go{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pill{position:relative}
.qfind{position:absolute;top:calc(100% + 8px);right:0;z-index:45;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 32px -12px rgba(0,0,0,.35);padding:14px}
.qfind form{display:flex;flex-direction:column;gap:8px}
.qfind label{font-weight:700;font-size:14px}
.qfrow{display:flex;gap:8px}
.qfrow .tin{flex:1;min-width:0}
.qferr{margin:0;font-size:12.5px;color:var(--bad)}
.qferr:empty{display:none}
.qfind .linkbtn{align-self:flex-start;font-size:13px}
.acts{grid-area:acts;justify-self:end;display:flex;align-items:center;gap:8px}
.ja{border:0;background:none;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;padding:6px 4px}
.startnew{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 18px;white-space:nowrap}
.startnew.confirm{background:var(--bad);color:#fff}
.exchip{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
@media (max-width:899px){
  .topin{grid-template-columns:1fr auto;grid-template-areas:"brand acts" "pill pill"}
  .pill{justify-self:stretch;justify-content:space-between}
}
@media (max-width:599px){
  .ja{display:none}
  .startnew{padding:8px 14px}
}

/* ---------- Shell with rails ---------- */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
@media (min-width:900px){
  .shell{grid-template-columns:minmax(0,1fr) 50px;min-height:calc(100vh - 60px)}
  .rail{display:flex;flex-direction:column;justify-content:flex-start;border:0;padding:0;color:#fff;position:relative}
  .rail span{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);height:calc(100vh - 70px - env(safe-area-inset-top,0px));height:calc(100dvh - 70px - env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:center;gap:10px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:14px;letter-spacing:.12em;padding:18px 0;width:100%}
  .rail.review{background:var(--review);color:var(--review-ink)}
  .rail.review span{transform:none}
  .rail b{font-size:18px;line-height:1}
}
.stage{min-width:0;padding-block:14px 150px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.stage{padding:16px 6px 60px 20px}}

/* ---------- Tabs & discount band ---------- */
.tabs{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--surface);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.tab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.tab.dragging{position:relative;z-index:5;scale:1.06;box-shadow:0 10px 24px rgba(0,0,0,.22);cursor:grabbing;transition:scale .12s}
.tabs.reordering .tab:not(.dragging){opacity:.85}
.band{background:var(--band);color:var(--band-ink);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:0 6px 0 0}
.bandbtn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--band-ink);border-radius:4px;background:transparent;color:var(--band-ink);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px}
.bandbtn .ico{width:14px;height:14px;transition:transform .15s}
.bandbtn[aria-expanded="false"] .ico{transform:rotate(180deg)}
.band select{border:0;border-radius:4px;background:var(--surface);color:var(--ink);padding:7px 10px;font-size:14px;max-width:100%;min-width:0}
.bchip{font-size:12.5px;padding:4px 9px;border-radius:4px;background:rgba(255,255,255,.18);color:var(--band-ink);font-weight:500}
.bchip.on{background:var(--badge);color:var(--badge-ink);font-weight:700}
.bcheck{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600;padding:5px 10px}
.bcheck input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.binfo{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px}
.binfo .ico{width:15px;height:15px}
/* T-Mobile Visa details */
.vtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.vt{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.vt .n{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.vt .t{font-weight:600;font-size:14px}
.vt .d{font-size:12.5px;color:var(--muted)}
.vt.hot{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.vcard{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:14px 16px}
.vcard h4{margin:0 0 8px}
.vcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.vcard .rr{border-top:1px solid var(--line);padding:7px 0;font-size:14px}
.vcard .rr:first-of-type{border-top:0}
.dpanel{background:var(--surface);border:1px solid var(--line);border-top:0;padding:14px;display:grid;gap:14px}
@media (min-width:720px){.dpanel{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
/* Sizing: the discount panel and the Add Devices box are drawn smaller and the plan tiers and line cards
   larger, each scaled as a whole. The Add Devices handle keeps its size. */
.dpanel{zoom:.85}
.trayin{zoom:.85}
.tierbar,.cards,.empty{zoom:1.4}
.flabel{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.fhint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.selwrap{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.selwrap select{flex:1;min-width:0;border:0;background:transparent;padding:9px 10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--accent);border-radius:6px;overflow:hidden;max-width:100%}
.seg button{border:0;background:var(--surface);color:var(--accent);font-weight:600;font-size:14px;padding:9px 14px;flex:1 1 auto}
.seg button + button{border-left:1.5px solid var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.45}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);display:grid;place-items:center;padding:0}
.stepper button:disabled{border-color:var(--line);color:var(--muted);opacity:.6}
.cmpl{gap:8px}
.cmpl .flabel{font-size:12.5px}
.cmpl .stepper{gap:4px}
.cmpl .stepper button{width:24px;height:24px;border-width:1.25px}
.cmpl .stepper .ico{width:14px;height:14px}
.cmpl .stepper output{min-width:30px;height:24px;line-height:22px;font-size:13px}
.cmpl .fhint{font-size:12px}
.cmpl .check{font-size:12.5px;font-weight:600;align-items:center;gap:6px;margin-left:8px}
.cmpl .check input{width:16px;height:16px;margin:0}
.hcmp .hcost{display:block}
.hcmp thead .hcost .pp{white-space:nowrap}
.hcmp thead .maxed{opacity:.6}
.stepper output{min-width:40px;height:30px;line-height:28px;text-align:center;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-variant-numeric:tabular-nums}

/* ---------- Tier strip ---------- */
.tierbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 12px}
.tiers{display:flex;align-items:stretch;background:var(--sunk);border:1px solid var(--line);border-radius:4px;overflow-x:auto;max-width:100%;font-size:13px}
.tiers .lead{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.tiers .lead small{font-weight:500;font-size:11px}
.tiers button{border:0;background:transparent;padding:8px 20px;white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.tiers button[aria-pressed="true"]{font-weight:700;color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tiers button:disabled{color:var(--muted)}
.tbtns{display:flex;align-items:center;gap:10px}
.obtn{border:1.5px solid var(--accent);border-radius:999px;background:var(--surface);color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 18px}
.vtog{display:inline-flex;border:1.5px solid var(--accent);border-radius:4px;overflow:hidden}
.vtog button{border:0;background:var(--surface);color:var(--accent);padding:6px 9px;display:grid;place-items:center}
.vtog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- Device cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05);min-width:0}
.chead{background:var(--sunk);padding:12px 14px;border-bottom:1px solid var(--line)}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:15px}
.ctitle .x{border:0;background:none;color:var(--accent);padding:4px;display:grid;place-items:center}
.cdev{display:flex;align-items:center;gap:14px;margin-top:10px}
.devico{position:relative;width:54px;height:58px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.devico svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--badge);color:var(--badge-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
/* Center the number by its digits, not the font's line box (which sits the digits high) */
.badge{display:block;text-align:center;align-content:center;line-height:1;text-box:trim-both cap alphabetic}
.cbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.cbody select.tin{font-size:15.5px;font-weight:500;padding-block:8px}
.editbtn{align-self:flex-start;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:10px 20px}
.cost{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.cost .h{font-weight:600;font-size:14.5px;margin-bottom:2px}
.cost .r{display:flex;justify-content:space-between;gap:10px}
.cost .r span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.cost small{color:var(--muted);font-size:12.5px}
.cost .cr span:last-child{color:var(--good)}
.cost .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:700}
.cwarn{font-size:12.5px;color:var(--warn);font-weight:600}
/* A new line zooms in from small; a removed one zooms back out. */
@keyframes popIn{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
@keyframes popOut{from{transform:none;opacity:1}to{transform:scale(.55);opacity:0}}
.popin{animation:popIn .25s cubic-bezier(.2,.8,.3,1) both}
.popout{animation:popOut .1s ease-in both;pointer-events:none}
@media (prefers-reduced-motion:reduce){.popin,.popout{animation:none}}
/* Review, Compare plans and Card details slide in when they open (0.3s) and back out when they close (0.075s)
   (only when opened from the page and when closed, not on every redraw or when moving between panels). */
@keyframes drawerIn{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes drawerOut{from{transform:none;opacity:1}to{transform:translateX(36px);opacity:0}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes scrimOut{from{opacity:1}to{opacity:0}}
.drawer.slidein{animation:drawerIn .3s cubic-bezier(.2,.8,.3,1) both}
.scrim.fadein{animation:scrimIn .25s ease-out both}
.drawer.slideout{animation:drawerOut .075s cubic-bezier(.4,0,1,1) both;pointer-events:none}
.scrim.fadeout{animation:scrimOut .075s ease-in both;pointer-events:none}
@media (prefers-reduced-motion:reduce){.drawer.slidein,.scrim.fadein,.drawer.slideout,.scrim.fadeout{animation:none}}
.cards.list{grid-template-columns:minmax(0,1fr);gap:8px}
.lrow{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 44px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.lrow .devico{width:44px;height:46px}
.lrow .devico svg{width:28px;height:28px}
.lrow .lt{min-width:0}
.lrow .lt b{display:block;font-size:14.5px}
.lrow .lt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lm{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lrow .lx{position:absolute;top:4px;right:4px;border:0;background:none;color:var(--accent);padding:6px;display:grid;place-items:center}
.lrow .lm button{display:block;margin-top:4px;border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:0}
.empty{border:2px dashed var(--line);border-radius:6px;padding:28px 18px;text-align:center;color:var(--muted)}

/* ---------- Add devices tray ---------- */
/* Add Devices is a sheet fixed to the bottom of the screen, lined up with the work area.
   Hiding it slides it down until only its tab shows; a spacer at the end of the page shrinks with it. */
.tray{position:fixed;z-index:30;bottom:0;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -12px 24px -18px rgba(0,0,0,.4);transition:transform .28s ease,box-shadow .28s ease}
.tray.shut{transform:translateY(100%);box-shadow:none}
@media (min-width:900px){.tray{left:calc((100vw - min(100vw,1320px)) / 2 + 20px);right:calc((100vw - min(100vw,1320px)) / 2 + 56px)}}
@media (max-width:899px){.tray{bottom:calc(54px + env(safe-area-inset-bottom,0px));padding-bottom:0}}
.trayspace{transition:height .28s ease}
@media (prefers-reduced-motion:reduce){.tray,.trayspace{transition:none}}
.handle{position:absolute;left:50%;top:-1px;transform:translate(-50%,-100%);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;background:var(--surface);color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 16px 4px;display:flex;flex-direction:column;align-items:center;gap:0}

/* Devices/SyncUP switch centered in the tray, with the count beside it on the right */
.traytop:has(.traytabs){display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:16px}

.tile svg.dev{width:92px;height:92px;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .plus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

function box(n, title, body){ return '<section class="box"><div class="boxh"><span class="num">' + n + '</span>' + title + '</div><div class="boxb">' + body + '</div></section>'; }
/* Store wording for offers in Edit Options: "Switcher" capitalized; a new line that doesn't need a number transfer
   is an "AAL"; "new line with a number transfer" reads "New line with a Port". Review and the email keep T-Mobile's wording. */
function offerWords(text, o){
  var t = String(text || "").replace(/\bswitcher\b/g, "Switcher").replace(/\bnew line with a number transfer\b/gi, function(m){ return (m.charAt(0) === "N" ? "N" : "n") + "ew line with a Port"; });
  t = t.replace(/\bnew lines with number transfers\b/gi, function(m){ return (m.charAt(0) === "N" ? "N" : "n") + "ew lines with Ports"; });
  if (o && (o.need === "port" || o.need === "port4") && text === o.label && !/\bSwitcher\b/.test(t)) {
    /* Port offers always say "Switcher" in their name. */
    if (/\bnew line\b/i.test(t)) t = t.replace(/\bnew line\b/i, "Switcher");
    else if (/\boffer\b/.test(t)) t = t.replace(/\boffer\b/, "Switcher offer");
    else t = t + " · Switcher";
  }
  if (o && o.need !== "port" && o.need !== "port4")
    t = t.replace(/\ba new (voice )?line\b/gi, function(m){ return (m.charAt(0) === "A" ? "An" : "an") + " AAL"; })
         .replace(/\bnew (voice )?line\b/gi, "AAL");
  return t;
}

  devices.forEach(function(m){ if (m.id && m.status !== "retired") cur[m.id] = {n:m.name, p:Math.round(m.price * 100) / 100}; });

/* GitHub Pages lets devices reuse a saved copy of the page for up to 10 minutes.

function pageCode(doc){
  var els = doc.querySelectorAll("script:not([src]), style"), out = "";

}
var MY_CODE = pageCode(document), _upd = 0;
function checkUpdate(){
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  if (Date.now() - _upd < 60 * 1000) return;
  _upd = Date.now();
  fetch(location.pathname + "?u=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.text() : ""; }).then(function(t){
    if (!t) return;
